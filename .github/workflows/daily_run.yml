name: Daily STEM Researcher Run

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-researcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run researcher script
        run: python daily_stem_researcher.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_log.json
          if git diff --cached --quiet; then
            echo "No changes to research_log.json. Skipping commit."
          else
            git commit -m "chore: auto-update research_log.json with latest STEM papers"
            git push
          fi
